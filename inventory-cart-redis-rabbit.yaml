
services: 
  redis-cache: 
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - inventory-cart-network  

  inventory-cart:
    #image: codewoksak/inventory-cart:v1
    image: inventory-cart:v1
    container_name: inventory-cart
    ports:
      - "8082:8082"
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - RABBIT_HOST=inventory-broker
      - RABBIT_PORT=5672
      - RABBIT_USERNAME=guest
      - RABBIT_PASSWORD=guest 
      - RABBIT_ORD_Q=order-queue
      - RABBIT_INV_Q=inventory-queue
      - RABBIT_EXCHANGE=fanout.ordering
      - RABBIT_ROUTE_KEY=ordering

    depends_on:
      - redis-cache
      - inventory-broker
    networks:
      - inventory-cart-network
